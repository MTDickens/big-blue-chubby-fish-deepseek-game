<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蓝色大肥鱼 角色展厅</title>
<meta name="description" content="蓝色大肥鱼同人游戏企划：角色 3D 模型展厅。大肥鱼、小鲸鱼宝宝、大圆鲸、白色龙娘、豆包帮首领。">
<meta name="theme-color" content="#0d1633">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M13 37C7 33 4 27 3 21c4 2 8 2 10 0 0 5 2 9 5 12z' fill='%232c63c4'/%3E%3Cellipse cx='34' cy='38' rx='22' ry='15' fill='%233b7be0'/%3E%3Cpath d='M16 42c6 9 28 11 38 0-8 5-28 6-38 0z' fill='%23f4f8ff'/%3E%3Ccircle cx='44' cy='35' r='2.6' fill='%230d1633'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap">
<link rel="stylesheet" href="gallery/style.css">
</head>
<body data-mode="solo">
<canvas id="view" aria-label="3D 角色展示，可拖动旋转、滚轮缩放"></canvas>
<div id="labels"></div>

<header id="top">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M13 37C7 33 4 27 3 21c4 2 8 2 10 0 0 5 2 9 5 12z" fill="#2c63c4"/>
      <ellipse cx="34" cy="38" rx="22" ry="15" fill="#3b7be0"/>
      <path d="M16 42c6 9 28 11 38 0-8 5-28 6-38 0z" fill="#f4f8ff"/>
      <circle cx="44" cy="35" r="2.6" fill="#0d1633"/><circle cx="45" cy="34" r="0.9" fill="#fff"/>
      <ellipse cx="48" cy="40.5" rx="3" ry="1.6" fill="#f49aa6" opacity="0.85"/>
      <path d="M36 23c0-4-3-6-6-6m6 6c0-4 3-6 6-6m-6 6v-8" stroke="#8fc3ff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div><b>蓝色大肥鱼</b><small>角色展厅 · 同人游戏企划</small></div>
  </div>
  <nav id="modes" class="seg" aria-label="展示模式"></nav>
</header>

<div id="banner" role="status" aria-live="polite"></div>

<aside id="roster" class="glass" aria-label="角色"></aside>

<section id="panel" class="glass" aria-label="角色信息与操作">
  <div id="info"></div>
  <div class="blk"><h3>动作</h3><div id="anims" class="chips"></div></div>
  <div class="blk"><h3>表情</h3><div id="expr" class="chips"></div></div>
  <div class="blk"><h3>场景</h3><div id="bgs" class="chips"></div></div>
  <div class="blk tools">
    <button id="turn" class="chip" type="button">转台</button>
    <button id="reset" class="chip" type="button">回正视角</button>
    <button id="shot" class="chip gold" type="button">截图</button>
  </div>
</section>

<footer id="credit">同人作品 · 原视频：B站 天才小白喵 · 背景全景图：Poly Haven（CC0）</footer>

<div id="load" class="glass show" aria-live="polite">
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <path d="M13 37C7 33 4 27 3 21c4 2 8 2 10 0 0 5 2 9 5 12z" fill="#2c63c4"/>
    <ellipse cx="34" cy="38" rx="22" ry="15" fill="#3b7be0"/>
    <path d="M16 42c6 9 28 11 38 0-8 5-28 6-38 0z" fill="#f4f8ff"/>
    <circle cx="44" cy="35" r="2.6" fill="#0d1633"/>
  </svg>
  <span>加载中</span>
  <div class="bar"><i></i></div>
  <b></b>
</div>

<script type="module" src="gallery/dist/app.js"></script>
</body>
</html>
